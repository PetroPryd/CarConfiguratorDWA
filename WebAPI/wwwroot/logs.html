<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs — Car Configurator</title>
    <style>
        body {
            font-family: system-ui, Segoe UI, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,.12);
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #eee;
        }

        header h1 {
            font-size: 1.2rem;
            margin: 0;
        }

        .logout {
            background: #6c757d;
            color: #fff;
            border: none;
            padding: .4rem .9rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .logout:hover {
            background: #5c636a;
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 1rem 1.5rem;
            max-height: 60vh;
            overflow-y: auto;
        }

        li {
            padding: .5rem 0;
            border-bottom: 1px solid #f3f3f3;
            font-size: .9rem;
        }

        .ts {
            color: #666;
            font-family: monospace;
            margin-right: .5rem;
        }

        .level {
            font-weight: 600;
            margin-right: .5rem;
            padding: .05rem .45rem;
            border-radius: 3px;
            font-size: .72rem;
        }

        .Info {
            background: #cfe2ff;
            color: #084298;
        }

        .Warning {
            background: #fff3cd;
            color: #664d03;
        }

        .Error {
            background: #f8d7da;
            color: #842029;
        }

        .Debug {
            background: #e2e3e5;
            color: #41464b;
        }

        footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: .5rem;
            padding: 1rem 1.5rem;
            border-top: 1px solid #eee;
        }

        select {
            padding: .4rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .show {
            background: #0d6efd;
            color: #fff;
            border: none;
            padding: .4rem .9rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .show:hover {
            background: #0b5ed7;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Log list</h1>
            <button class="logout" id="logoutBtn">Logout</button>
        </header>

        <ul id="logList"></ul>

        <footer>
            <select id="count">
                <option value="10">10</option>
                <option value="25" selected>25</option>
                <option value="50">50</option>
            </select>
            <button class="show" id="showBtn">Show Logs</button>
        </footer>
    </div>

    <script>
    const token = localStorage.getItem('token');

    if (!token) window.location.href = 'login.html';

    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('showBtn').addEventListener('click', loadLogs);

    loadLogs();

    async function loadLogs() {
      const n = document.getElementById('count').value;
      try {
            const res = await fetch(`/api/logs/get/${n}`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (res.status === 401) { logout(); return; }

            const logs = await res.json();
            render(logs);
      } catch {
            document.getElementById('logList').innerHTML = '<li>Could not reach the server.</li>';
      }
    }

    function render(logs) {
      const list = document.getElementById('logList');
      if (!logs.length) { list.innerHTML = '<li>No logs to display.</li>'; return; }

      list.innerHTML = logs.map(l => {
        const ts = new Date(l.timestamp).toLocaleString();
        return `<li><span class="ts">${ts}</span>` +
               `<span class="level ${l.level}">${l.level}</span>` +
               `${escapeHtml(l.message)}</li>`;
      }).join('');
    }

    function escapeHtml(s) {
          return String(s).replace(/[&<>"']/g, c =>
                ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }

    function logout() {
          localStorage.removeItem('token');
          localStorage.removeItem('username');
          window.location.href = 'login.html';
    }
    </script>
</body>
</html>
